name: Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: file:./dev.db

      - name: Run automated tests
        run: npm test

      - name: Build Windows installer
        run: npm run package:win

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' -File
          if (-not $installer) { throw 'No Windows installer was produced.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --title "Cotizfy $env:GITHUB_REF_NAME" --generate-notes
